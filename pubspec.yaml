name: my_app
description: "Dream diary and sleep tracking, stored privately on your device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  fl_chart: ^1.0.0
  flutter_local_notifications: ^19.4.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  timezone: ^0.10.1
  crypto: ^3.0.6
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^5.2.1
  http: ^1.5.0
  dio: ^5.8.0+1
  provider: ^6.1.2
  go_router: ^14.8.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
